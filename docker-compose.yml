name: ${COMPOSE_PROJECT_NAME:-paaweb}

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paaweb}
      POSTGRES_USER: ${POSTGRES_USER:-paaweb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/init-env.sh first}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./SQL/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./SQL/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./SQL/migration_besti_team_space.sql:/docker-entrypoint-initdb.d/03-besti-team-space.sql:ro
      - ./SQL/migration_besti_roles_awards.sql:/docker-entrypoint-initdb.d/04-besti-roles-awards.sql:ro
      - ./SQL/migration_besti_xcpc_awards.sql:/docker-entrypoint-initdb.d/05-besti-xcpc-awards.sql:ro
      - ./SQL/migration_besti_academic_catalog.sql:/docker-entrypoint-initdb.d/06-besti-academic-catalog.sql:ro
      - ./SQL/migration_besti_certificate_catalog.sql:/docker-entrypoint-initdb.d/07-besti-certificate-catalog.sql:ro
      - ./SQL/migration_besti_history_claims.sql:/docker-entrypoint-initdb.d/08-besti-history-claims.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [app_network]

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-paaweb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paaweb}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/init-env.sh first}
      FILE_UPLOAD_PATH: /app/uploads/
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:-false}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3403}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      HYDRO_BASE_URL: ${HYDRO_BASE_URL:-}
      QQ_BOT_IMAGE_HOSTS: ${QQ_BOT_IMAGE_HOSTS:-}
      CRAWLER_SERVICE_URL: ${CRAWLER_SERVICE_URL:-http://localhost:8000}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROTOCOL: ${SPRING_MAIL_PROTOCOL:-smtp}
      SPRING_MAIL_SSL_ENABLED: ${SPRING_MAIL_SSL_ENABLED:-false}
      SPRING_MAIL_STARTTLS_ENABLED: ${SPRING_MAIL_STARTTLS_ENABLED:-true}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [app_network]

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8080
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3403}
        NEXT_PUBLIC_SCHOOL_OJ_URL: ${NEXT_PUBLIC_SCHOOL_OJ_URL:-}
    environment:
      API_URL: http://backend:8080
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3403}
      PUBLIC_VP_SITE_URL: ${PUBLIC_VP_SITE_URL:-}
      NODE_OPTIONS: --max-old-space-size=512
      TZ: ${TZ:-Asia/Shanghai}
    depends_on: [backend]
    restart: unless-stopped
    networks: [app_network]

  gateway:
    image: nginx:stable-alpine
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-3403}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - uploads:/srv/uploads:ro
    depends_on: [frontend, backend]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1/healthz | grep -q ok']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [app_network]

volumes:
  pg_data:
  uploads:

networks:
  app_network:
    driver: bridge
