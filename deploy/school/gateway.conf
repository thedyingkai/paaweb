user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    # 200 个在线用户会同时占用客户端连接和到前后端的上游连接，预留足够余量。
    worker_connections 4096;
    multi_accept on;
}

http {
    # Only the host reverse proxy can supply the real client address.
    set_real_ip_from 172.30.34.1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    map "$realip_remote_addr:$http_x_forwarded_proto" $school_proxy_scheme {
        default $scheme;
        "172.30.34.1:https" https;
    }
    map $school_proxy_scheme $school_proxy_port {
        default 80;
        https 443;
    }
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time limit=$limit_req_status';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 100;
    client_header_timeout 10s;
    client_body_timeout 15s;
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain text/event-stream image/svg+xml;

    # Axios/API clients still need JSON, while a browser navigating directly to
    # an API/download URL needs an HTML retry page. Without this distinction an
    # upstream 429 is rendered as raw JSON because client-side interceptors have
    # not been loaded for a document request.
    map "$http_sec_fetch_dest:$http_accept" $traffic_error_format {
        default json;
        ~^document: html;
        ~^[^:]*:.*text/html html;
    }

    # 按至少 200 人同时在线设计。页面/API 的单 IP 容量也必须覆盖校园网、宿舍网
    # 等共享公网出口，避免数十到数百名用户被误判成同一个访问者。
    #
    # 注意：Next.js 的 <Link> 会在链接进入视口时自动预取 RSC 数据，一次页面刷新
    # 或跳转可能同时产生 20~50 个页面请求。页面与普通 API 的突发容量必须覆盖
    # "一次刷新"，否则正常用户刷新页面就会收到 429。平均速率依旧受限，真正拦住
    # 洪水的是下面按全站维度统计的 *_global 区域。
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_zone $binary_remote_addr zone=page_ip:10m rate=100r/s;
    limit_req_zone $server_name zone=page_global:1m rate=400r/s;
    limit_req_zone $binary_remote_addr zone=api_ip:10m rate=100r/s;
    limit_req_zone $server_name zone=api_global:1m rate=400r/s;
    # 鉴权状态同步单独一个区域：权限变更推送后前端会立刻拉取 /api/user/me。
    # 如果它和页面数据请求争抢同一份 api_ip 令牌，被 429 时前端只能继续用旧权限，
    # 又变成"要重新登录才生效"。
    limit_req_zone $binary_remote_addr zone=authsync_ip:10m rate=50r/s;
    # 登录/验证码允许共享 IP 下出现 200 人突发；验证码仍由后端按邮箱做 60 秒冷却。
    limit_req_zone $binary_remote_addr zone=login_ip:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=code_ip:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload_ip:10m rate=60r/m;

    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_conn_zone $server_name zone=conn_global:1m;
    limit_conn_zone $server_name zone=upload_global:1m;
    limit_conn_zone $binary_remote_addr zone=download_ip:10m;
    limit_conn_zone $server_name zone=download_global:1m;
    limit_conn_zone $binary_remote_addr zone=sse_ip:10m;
    limit_conn_zone $server_name zone=sse_global:1m;

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 64;
    }

    upstream backend_upstream {
        server backend:8080;
        keepalive 64;
    }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 5m;

        limit_conn conn_ip 300;
        limit_conn conn_global 1000;

        # Browser document requests receive a small HTML retry page instead of
        # exposing the JSON gateway body. API locations below override this with
        # the JSON response expected by Axios and other API clients.
        error_page 429 = /_traffic_errors/429.html;
        error_page 503 = /_traffic_errors/503.html;
        location = /_traffic_errors/429.html {
            internal;
            default_type text/html;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访问人数较多</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5fbff;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(520px,calc(100% - 40px));padding:42px 28px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 20px 60px #16527624}h1{margin:16px 0 10px;font-size:28px}p{color:#60788d;line-height:1.7}.icon{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1677ff,#36cfc9);color:#fff;font-size:30px}strong{color:#1677ff}</style></head><body><main><div class="icon">⚡</div><h1>当前访问人数较多</h1><p>为保护服务稳定性，系统将在 <strong id="seconds">10</strong> 秒后自动返回并重试当前页面，请不要关闭页面。</p></main><script>(function(){var n=10,e=document.getElementById("seconds");var t=setInterval(function(){n-=1;e.textContent=n;if(n<=0){clearInterval(t);location.reload();}},1000);})();</script></body></html>';
        }
        location = /_traffic_errors/429.json {
            internal;
            default_type application/json;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 429 '{"code":429,"msg":"访问过于频繁，请稍后重试","data":null}';
        }
        location = /_traffic_errors/503.html {
            internal;
            default_type text/html;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 503 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服务正在缓冲</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5fbff;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(520px,calc(100% - 40px));padding:42px 28px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 20px 60px #16527624}h1{margin:16px 0 10px;font-size:28px}p{color:#60788d;line-height:1.7}.icon{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1677ff,#36cfc9);color:#fff;font-size:30px}strong{color:#1677ff}</style></head><body><main><div class="icon">⚡</div><h1>服务正在缓冲</h1><p>服务器正在处理其他耗时任务，系统将在 <strong id="seconds">10</strong> 秒后自动重试，请不要关闭页面。</p></main><script>(function(){var n=10,e=document.getElementById("seconds");var t=setInterval(function(){n-=1;e.textContent=n;if(n<=0){clearInterval(t);location.reload();}},1000);})();</script></body></html>';
        }
        location = /_traffic_errors/unavailable.html {
            internal;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            return 404 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>附件暂时无法下载</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5fbff;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{width:min(520px,calc(100% - 40px));padding:42px 28px;text-align:center;background:#fff;border-radius:20px;box-shadow:0 20px 60px #16527624}h1{margin:16px 0 10px;font-size:26px}p{color:#60788d;line-height:1.7}.icon{width:64px;height:64px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1677ff,#36cfc9);color:#fff;font-size:30px}</style></head><body><main><div class="icon">📄</div><h1>附件暂时无法下载</h1><p>该文件不存在或服务器暂时无法读取。请刷新页面后重试，若仍然失败请联系平台管理员。</p></main></body></html>';
        }

        location = /_traffic_errors/503.json {
            internal;
            default_type application/json;
            add_header Retry-After 10 always;
            add_header Cache-Control "no-store" always;
            return 503 '{"code":503,"msg":"服务器正在处理其他耗时任务，请稍后重试","data":null}';
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # 每个用户只保留一个 SSE 连接由后端保证；网关防止单 IP 和全局连接泄漏。
        location = /api/notification/stream {
            limit_conn sse_ip 200;
            limit_conn sse_global 300;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 35m;
            proxy_send_timeout 35m;
            proxy_pass http://backend_upstream/notification/stream;
            include /etc/nginx/proxy_headers.conf;
        }

        location ~ ^/api/user/(?:login|login-by-code|external/login)$ {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=login_ip burst=200 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        location ~ ^/api/user/(?:send-code|external/send-code)$ {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=code_ip burst=200 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # 鉴权状态同步：身份认证状态、角色和权限以服务端为准，前端在收到
        # auth-state-change 推送、窗口重新聚焦或切换路由时会调用该接口。
        location = /api/user/me {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=authsync_ip burst=200 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            proxy_pass http://backend_upstream/user/me;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /api/file/upload {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            # 20MB 文件之外还要容纳 multipart 边界、文件名和其他表单字段。
            client_max_body_size 21m;
            limit_req zone=upload_ip burst=30 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            # 文件上传是唯一单独限制并发流的入口：全站最多同时 30 路。
            limit_conn upload_global 30;
            proxy_request_buffering on;
            proxy_read_timeout 60s;
            proxy_pass http://backend_upstream/file/upload;
            include /etc/nginx/proxy_headers.conf;
        }

        # 批量邮件发送是同步逐封发送：1000 封通常需要十几分钟才返回。
        # 通用 /api/ 块的 proxy_read_timeout 只有 30s，长批次会被网关 504 截断，
        # 所以这里单独放宽读超时；请求体也放宽到 20m（server 块默认 5m，
        # 单次 5000~10000 位收件人的 JSON 名单可能接近甚至超过 5m）。
        location ~ ^/api/admin/bulk-email/send(?:/|$) {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            client_max_body_size 20m;
            limit_req zone=api_ip burst=300 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 600s;
            proxy_read_timeout 3600s;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # Camera-original photo ZIPs are processed one image at a time, before publication.
        location ~ ^/api/leaderboard/admin/[0-9]+/resolver/photos$ {
            client_max_body_size 513m;
            limit_req zone=upload_ip burst=2 nodelay;
            limit_conn upload_global 2;
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 300s;
            proxy_read_timeout 600s;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # Excel 导入等管理端上传单独放宽至 10MB，并与普通文件上传共享 30 路并发上限。
        location ~ ^/api/(?:certificate/grant/import/(?:preview|distribute)|admin/bulk-email/parse|admin/school-signup/students/import)(?:/|$) {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            client_max_body_size 11m;
            limit_req zone=upload_ip burst=30 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            limit_conn upload_global 30;
            proxy_request_buffering on;
            proxy_read_timeout 60s;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # 图片证书预览/下载共用较高的传输额度；前 4MB 不限速，之后 512KB/s。
        # 普通附件仍使用下面的原有策略。两者共用下载并发上限。
        location ~ ^/api/certificate/grant/(?:guest/)?(?:download|preview)(?:/|$) {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=api_ip burst=300 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            limit_conn download_ip 200;
            limit_conn download_global 200;
            limit_rate_after 4m;
            limit_rate 512k;
            proxy_buffering on;
            proxy_read_timeout 90s;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # 下载允许 200 路/IP、200 路全站并发，避免同一通知的多个附件互相触发 429。
        # 每路在前 1MB 后限速 128KB/s，仍给 10Mbps 链路保留带宽余量。
        location ~ ^/api/file/download/ {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=api_ip burst=300 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            limit_conn download_ip 200;
            limit_conn download_global 200;
            limit_rate_after 1m;
            limit_rate 128k;
            proxy_buffering on;
            proxy_read_timeout 90s;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # 使用正则并放在静态资源正则之前，避免带 .png/.js 后缀的 API 路径被误转给前端。
        location ~ ^/api/ {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=api_ip burst=300 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            proxy_request_buffering on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://backend_upstream;
            rewrite ^/api/(.*)$ /$1 break;
            include /etc/nginx/proxy_headers.conf;
        }

        # 兼容数据库中的旧版 /uploads/{storageKey} 地址；仍由后端执行文件权限校验。
        location ^~ /uploads/ {
            error_page 429 = /_traffic_errors/429.$traffic_error_format;
            error_page 503 = /_traffic_errors/503.$traffic_error_format;
            proxy_intercept_errors on;
            limit_req zone=api_ip burst=300 nodelay;
            limit_req zone=api_global burst=800 nodelay;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        # 后端完成权限校验后，以 X-Accel-Redirect 交回 Nginx 发送本地文件。
        # 若 Nginx 打不开文件（历史上落盘权限为 0600、文件被删除或挂载异常），
        # 默认会返回一张没有内容的 403 页，浏览器只会显示"网页可能暂时无法连接"。
        # 这里换成可读的提示页，便于用户判断是附件本身的问题而不是网络问题。
        location ^~ /_protected_downloads/ {
            internal;
            alias /srv/uploads/;
            limit_rate_after 1m;
            limit_rate 128k;
            error_page 403 404 = /_traffic_errors/unavailable.html;
        }

        location ^~ /_protected_media/ {
            internal;
            alias /srv/uploads/;
        }

        # Next.js 指纹静态资源交给浏览器长期缓存，不占页面请求配额。
        location ^~ /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        # The recovery page must always remain reachable after the caller has
        # exhausted the normal page bucket; otherwise refreshing it can itself
        # produce another 429 before the countdown can run.
        location = /busy {
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        location = /busy/ {
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_headers.conf;
        }

        location / {
            limit_req zone=page_ip burst=300 nodelay;
            limit_req zone=page_global burst=800 nodelay;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_headers.conf;
        }
    }
}
