server {
    listen 80;
    listen [::]:80;
    server_name bestiacm.thedyingkai.cn paa.thedyingkai.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/paaweb/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://bestiacm.thedyingkai.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bestiacm.thedyingkai.cn paa.thedyingkai.cn;
    ssl_certificate /opt/paaweb/tls/fullchain.pem;
    ssl_certificate_key /opt/paaweb/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaaWebSSL:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    if ($host = paa.thedyingkai.cn) { return 308 https://bestiacm.thedyingkai.cn$request_uri; }
    client_max_body_size 65m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    access_log /www/wwwlogs/bestiacm.thedyingkai.cn.log;
    error_log /www/wwwlogs/bestiacm.thedyingkai.cn.error.log;
    location / {
        proxy_pass http://127.0.0.1:3403;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
    }
}
