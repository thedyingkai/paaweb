proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# The gateway is published on host loopback only. The host TLS virtual server
# overwrites these headers, and gateway.conf trusts that host address only.
proxy_set_header X-Forwarded-Proto $school_proxy_scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $school_proxy_port;
proxy_set_header X-Accel-Supported 1;
proxy_set_header Connection "";
